<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="gr" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cg" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="#0d1117"/>

  <!-- Chrono circle -->
  <circle cx="256" cy="210" r="150" fill="none" stroke="#1a2a3a" stroke-width="18"/>
  <!-- Progress arc (cyan ~75%) -->
  <circle cx="256" cy="210" r="150" fill="none"
          stroke="#4df5d9" stroke-width="18" stroke-linecap="round"
          stroke-dasharray="707 942" stroke-dashoffset="235"
          transform="rotate(-90 256 210)" filter="url(#gr)" opacity="0.9"/>
  <!-- Inner circle -->
  <circle cx="256" cy="210" r="120" fill="#0d1117"/>

  <!-- Sabre horizontal (opposition) -->
  <!-- handle left -->
  <rect x="52" y="203" width="60" height="14" rx="5" fill="#777"/>
  <rect x="55" y="206" width="55" height="8" rx="3" fill="#aaa"/>
  <!-- guard -->
  <rect x="108" y="192" width="12" height="36" rx="4" fill="#555"/>
  <!-- blade cyan with glow -->
  <rect x="120" y="206" width="270" height="10" rx="5" fill="#4df5d9" filter="url(#gr)" opacity="0.85"/>
  <rect x="120" y="208" width="270" height="6" rx="3" fill="#a0fff0"/>
  <!-- tip glow -->
  <circle cx="390" cy="211" r="10" fill="#4df5d9" filter="url(#cg)" opacity="0.7"/>

  <!-- Clock hands -->
  <!-- minute hand -->
  <line x1="256" y1="210" x2="256" y2="100" stroke="#c9d1d9" stroke-width="8" stroke-linecap="round"/>
  <!-- hour hand -->
  <line x1="256" y1="210" x2="316" y2="160" stroke="#4df5d9" stroke-width="10" stroke-linecap="round" filter="url(#gr)"/>
  <!-- center dot -->
  <circle cx="256" cy="210" r="10" fill="#4df5d9"/>

  <!-- % symbol bottom right of circle -->
  <text x="296" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="32" font-weight="bold"
        fill="#4df5d9" opacity="0.7">%</text>

  <!-- App label -->
  <text x="256" y="450" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="52" font-weight="900" letter-spacing="6"
        fill="#c9d1d9">CHRONO</text>
  <text x="256" y="492" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="22" font-weight="300" letter-spacing="5"
        fill="#4df5d9">SL</text>
</svg>
